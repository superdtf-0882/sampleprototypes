<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Facer — Prototypes &amp; Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink:      '#0A0C10',
            panel:    '#14171D',
            hairline: '#232730',
            paper:    '#ECEEF1',
            smoke:    '#C9CDD3',
            dim:      '#868C97',
            brass:    '#B8924A',
            dormant:  '#7A8294',
          },
          fontFamily: {
            display: ['Fraunces', 'Georgia', 'serif'],
            sans:    ['Inter', 'system-ui', 'sans-serif'],
            mono:    ['"JetBrains Mono"', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    html, body { background: radial-gradient(ellipse 80% 60% at 50% 35%, #11141A 0%, #07080B 100%); }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body class="font-sans text-smoke min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-hairline px-8 py-5 flex items-baseline justify-between">
    <span class="font-display text-paper text-xl font-medium tracking-tight">David Facer</span>
    <span class="font-mono text-dim text-xs uppercase tracking-widest">Prototypes &amp; Projects</span>
  </header>

  <!-- Hero -->
  <div class="px-8 pt-16 pb-12 max-w-2xl">
    <p class="font-display text-smoke text-2xl font-400 leading-relaxed">
      A place to showcase prototypes and software collaboration projects.
    </p>
  </div>

  <!-- Gallery -->
  <main class="px-8 pb-24 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 items-start">

    <a href="https://emotional-regulation-protocol.vercel.app/"
       target="_blank" rel="noopener"
       class="group block bg-panel border border-hairline rounded-lg p-6 transition-colors duration-200 hover:border-brass">
      <p class="font-mono text-dim text-xs uppercase tracking-widest mb-3">Prototype</p>
      <h2 class="font-display text-paper text-lg font-medium leading-snug mb-2">
        Dinosaur Comics Therapy
      </h2>
      <p class="font-mono text-dim text-xs leading-relaxed mb-6">
        Maastrichtian emotional regulation protocol &mdash; Methodology v1.3
      </p>
      <span class="font-sans text-brass text-sm font-medium group-hover:underline">
        Open &rarr;
      </span>
    </a>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-hairline px-8 py-5">
    <p class="font-mono text-dim text-xs">&copy; 2026 David Facer</p>
  </footer>

</body>
</html>
